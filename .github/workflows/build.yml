name: build

on:
  push:
    paths: ['base', 'series', 'patches/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Show baseline
        run: cat base

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm bc bison flex cpio dwarves \
            libssl-dev libelf-dev
          # mkbootimg 使用仓库内 vendored 版本（Ubuntu noble 的 apt 包缺 gki 模块，开箱即坏）
          ./mkbootimg --help >/dev/null && echo "mkbootimg ok"

      - name: Setup patched kernel tree
        run: ./scripts/setup-kernel.sh

      - name: Build kernel
        run: |
          ./scripts/build-kernel.sh
          ./scripts/boot-img.sh

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot-salami-${{ github.run_number }}
          path: |
            kernel/out/boot-salami.img
            kernel/out/include/config/kernel.release
          if-no-files-found: error
